# Builds native\build\version.dll. A pushed tag v* publishes it as a GitHub release (a tag with a '-', like
# v0.2.0-beta1, becomes a pre-release); a manual run only builds and keeps the DLL as a workflow artifact.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build version.dll
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File native\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: version.dll
          path: native/build/version.dll

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = @'
          ## Installation
          1. Download `version.dll` below and put it in the game folder, next to `Forager.exe`
             (Steam → Forager → Manage → Browse local files).
          2. Every player needs it. Only the Steam version 4.1.9 (build 2021-01-29) is supported.
          3. The main menu gets a **COOP** item. Details are in the README.

          To uninstall, delete `version.dll` from the game folder.
          '@
          $flags = @('--generate-notes', '--notes', $notes, '--title', $env:TAG)
          if ($env:TAG.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:TAG native/build/version.dll @flags
