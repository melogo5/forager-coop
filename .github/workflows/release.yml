# Builds native\build\version.dll and the Steam Workshop package zip (mods\ForagerCoop\build.ps1; uploaded to Steam
# by hand). A pushed tag v* publishes both as a GitHub release (a tag with a '-', like v0.2.0-beta1, becomes a
# pre-release); a manual run only builds and keeps both as workflow artifacts.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build version.dll
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File native\build.ps1

      - name: Build Workshop package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File mods\ForagerCoop\build.ps1 -Version ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: version.dll
          path: native/build/version.dll

      - uses: actions/upload-artifact@v4
        with:
          name: workshop
          path: mods/ForagerCoop/build/ForagerCoop-Workshop-*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = @'
          ## Installation
          Every player needs the co-op. Only the Steam version 4.1.9 (build 2021-01-29) is supported.

          ### Option 1: Steam Workshop (recommended)
          1. Subscribe to [ForagerCoop on Steam Workshop](https://steamcommunity.com/sharedfiles/filedetails/?id=3831217775).
          2. In the game: **MODDING** → enable **ForagerCoop** → **COMPILE**.
          3. Wait for the notice *Ready! Close and reopen Forager from Steam* at the top of the screen.
          4. Close the game and start it again from Steam. The main menu gets a **COOP** item.

          After a mod update the notice appears again: restart the game once more.
          To turn the co-op off, unsubscribe from the mod.

          ### Option 2: version.dll by hand
          1. Download `version.dll` below and put it in the game folder, next to `Forager.exe`
             (Steam → Forager → Manage → Browse local files).
          2. The main menu gets a **COOP** item. Details are in the README.

          To uninstall, delete `version.dll` from the game folder.

          `ForagerCoop-Workshop-*.zip` is the Steam Workshop package of the same build; players do not need it.
          '@
          $flags = @('--generate-notes', '--notes', $notes, '--title', $env:TAG)
          if ($env:TAG.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:TAG native/build/version.dll "mods/ForagerCoop/build/ForagerCoop-Workshop-$env:TAG.zip" @flags
